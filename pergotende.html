<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuratore Pergotende | SALFER SRL</title>
  <style>
    /* ---- RESET & VARIABILI ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* Sostituisci con i tuoi colori aziendali */
      --primary: #1a3c5e;      /* blu scuro */
      --accent: #c9a227;       /* oro */
      --bg-light: #f8f9fa;
      --bg-dark: #1e1e1e;
      --text-dark: #333;
      --text-light: #fff;
      --border: #ddd;
    }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
    }

    /* ---- HEADER (menu e logo) ---- */
    .site-header {
      background: var(--primary);
      color: var(--text-light);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .site-header .logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .site-header nav ul {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }
    .site-header nav a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: color .2s;
    }
    .site-header nav a:hover { color: var(--accent); }

    /* ---- LAYOUT CONFIGURATORE ---- */
    .configurator {
      max-width: 1300px;
      margin: 2rem auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      padding: 0 1.5rem;
    }
    @media (max-width: 900px) {
      .configurator { grid-template-columns: 1fr; }
    }

    /* Anteprima */
    .preview-area {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      position: relative;
    }
    .preview-area svg {
      max-width: 100%;
      height: auto;
      transition: all .3s;
    }

    /* Pannello opzioni */
    .options-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .options-panel h3 {
      font-size: 1.1rem;
      margin-bottom: .5rem;
      color: var(--primary);
      border-bottom: 2px solid var(--accent);
      padding-bottom: .3rem;
    }
    .option-group {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .option-group label {
      font-weight: 600;
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #555;
    }
    .option-group select,
    .option-group input[type="range"] {
      width: 100%;
      padding: .6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: #fff;
    }
    .option-group input[type="range"] { padding: 0; }
    .range-value {
      font-weight: 700;
      color: var(--primary);
      text-align: right;
    }

    /* Colori */
    .color-swatches {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
    }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: border .2s, transform .2s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: var(--accent); }

    /* Prezzo */
    .price-box {
      background: var(--bg-light);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      margin-top: auto;
    }
    .price-box .price {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .price-box .price small {
      font-size: .9rem;
      font-weight: 400;
      color: #777;
    }
    .btn-cta {
      display: block;
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: var(--primary);
      font-weight: 700;
      font-size: 1.1rem;
      text-align: center;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s, color .2s;
      text-decoration: none;
      margin-top: .5rem;
    }
    .btn-cta:hover {
      background: var(--primary);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- ======== HEADER ======== -->
  <header class="site-header">
    <div class="logo">SALFER SRL</div>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/pergotende">Pergotende</a></li>
        <li><a href="/bioclimatiche">Bioclimatiche</a></li>
        <li><a href="/vetrate">Vetrate</a></li>
        <li><a href="/contatti">Contatti</a></li>
      </ul>
    </nav>
  </header>

  <!-- ======== CONFIGURATORE ======== -->
  <main class="configurator">

    <!-- Anteprima -->
    <section class="preview-area">
      <svg id="pergolaModel" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Struttura base -->
        <rect id="structure" x="100" y="200" width="400" height="150" fill="#8B8B8B" rx="5"/>
        <!-- Tetto -->
        <rect id="roof" x="100" y="150" width="400" height="50" fill="#6B6B6B" rx="5"/>
        <!-- Montanti -->
        <rect x="100" y="200" width="20" height="150" fill="#8B8B8B"/>
        <rect x="480" y="200" width="20" height="150" fill="#8B8B8B"/>
        <!-- Lamelle (nascoste di default) -->
        <g id="louvers" style="display:none;">
          <rect x="120" y="160" width="360" height="8" fill="#A0A0A0" rx="2"/>
          <rect x="120" y="172" width="360" height="8" fill="#A0A0A0" rx="2"/>
          <rect x="120" y="184" width="360" height="8" fill="#A0A0A0" rx="2"/>
        </g>
        <!-- Tenda (nascosta di default) -->
        <g id="curtain" style="display:none;">
          <rect x="120" y="150" width="360" height="100" fill="#D4C9A8" opacity="0.8"/>
        </g>
        <!-- LED (nascosti di default) -->
        <g id="leds" style="display:none;">
          <circle cx="150" cy="210" r="4" fill="#FFD700"/>
          <circle cx="250" cy="210" r="4" fill="#FFD700"/>
          <circle cx="350" cy="210" r="4" fill="#FFD700"/>
          <circle cx="450" cy="210" r="4" fill="#FFD700"/>
        </g>
      </svg>
    </section>

    <!-- Opzioni -->
    <aside class="options-panel">
      <h3>Configura la tua Pergotenda</h3>

      <!-- Dimensioni -->
      <div class="option-group">
        <label>Larghezza (cm)</label>
        <input type="range" id="width" min="200" max="600" value="400" step="10">
        <div class="range-value" id="widthVal">400 cm</div>
      </div>
      <div class="option-group">
        <label>Profondità (cm)</label>
        <input type="range" id="depth" min="150" max="400" value="300" step="10">
        <div class="range-value" id="depthVal">300 cm</div>
      </div>

      <!-- Colore struttura -->
      <div class="option-group">
        <label>Colore Struttura</label>
        <div class="color-swatches" id="colorSwatches">
          <div class="swatch active" data-color="#8B8B8B" style="background:#8B8B8B;" title="Grigio"></div>
          <div class="swatch" data-color="#2C2C2C" style="background:#2C2C2C;" title="Nero"></div>
          <div class="swatch" data-color="#FFFFFF" style="background:#FFFFFF; border:1px solid #ccc;" title="Bianco"></div>
          <div class="swatch" data-color="#5C4033" style="background:#5C4033;" title="Marrone"></div>
        </div>
      </div>

      <!-- Tipo di tetto -->
      <div class="option-group">
        <label>Tipo di Tetto</label>
        <select id="roofType">
          <option value="solid">Tetto pieno</option>
          <option value="louvers">Lamelle orientabili</option>
          <option value="curtain">Tenda retraibile</option>
        </select>
      </div>

      <!-- Accessori -->
      <div class="option-group">
        <label>Accessori</label>
        <label style="display:flex; align-items:center; gap:.5rem; font-weight:400;">
          <input type="checkbox" id="ledCheck"> Illuminazione LED
        </label>
      </div>

      <!-- Prezzo -->
      <div class="price-box">
        <div class="price" id="totalPrice">€ 0</div>
        <small>Prezzo indicativo IVA inclusa</small>
      </div>
      <a href="#" class="btn-cta" id="ctaBtn">Richiedi Preventivo</a>
    </aside>
  </main>

  <script>
    // ====== DATI ======
    const basePrice = 2500;          // prezzo base in €
    const pricePerSqm = 120;         // prezzo per m²
    const ledPrice = 350;            // costo LED

    // ====== ELEMENTI DOM ======
    const widthInput   = document.getElementById('width');
    const depthInput   = document.getElementById('depth');
    const widthVal     = document.getElementById('widthVal');
    const depthVal     = document.getElementById('depthVal');
    const colorSwatches= document.querySelectorAll('.swatch');
    const roofType     = document.getElementById('roofType');
    const ledCheck     = document.getElementById('ledCheck');
    const totalPriceEl = document.getElementById('totalPrice');
    const ctaBtn       = document.getElementById('ctaBtn');

    // SVG elements
    const structure    = document.getElementById('structure');
    const roof         = document.getElementById('roof');
    const louvers      = document.getElementById('louvers');
    const curtain      = document.getElementById('curtain');
    const leds         = document.getElementById('leds');

    // ====== STATO ======
    let state = {
      width: 400,
      depth: 300,
      color: '#8B8B8B',
      roof: 'solid',
      led: false
    };

    // ====== FUNZIONI ======
    function updatePreview() {
      // Aggiorna dimensioni SVG (scala)
      const scaleX = state.width / 400;
      const scaleY = state.depth / 300;
      structure.setAttribute('width', 400 * scaleX);
      structure.setAttribute('height', 150 * scaleY);
      roof.setAttribute('width', 400 * scaleX);
      roof.setAttribute('height', 50 * scaleY);
      roof.setAttribute('y', 150 * scaleY);

      // Colore
      structure.setAttribute('fill', state.color);
      roof.setAttribute('fill', shadeColor(state.color, -20));

      // Tetto
      if (state.roof === 'solid') {
        roof.style.display = 'block';
        louvers.style.display = 'none';
        curtain.style.display = 'none';
      } else if (state.roof === 'louvers') {
        roof.style.display = 'none';
        louvers.style.display = 'block';
        curtain.style.display = 'none';
      } else if (state.roof === 'curtain') {
        roof.style.display = 'none';
        louvers.style.display = 'none';
        curtain.style.display = 'block';
      }

      // LED
      leds.style.display = state.led ? 'block' : 'none';
    }

    function updatePrice() {
      const area = (state.width / 100) * (state.depth / 100); // m²
      let price = basePrice + (area * pricePerSqm);
      if (state.led) price += ledPrice;
      totalPriceEl.textContent = '€ ' + price.toLocaleString('it-IT');
    }

    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1,3), 16);
      let G = parseInt(color.substring(3,5), 16);
      let B = parseInt(color.substring(5,7), 16);
      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);
      R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;
      return "#" + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1);
    }

    // ====== EVENTI ======
    widthInput.addEventListener('input', (e) => {
      state.width = +e.target.value;
      widthVal.textContent = state.width + ' cm';
      updatePreview();
      updatePrice();
    });
    depthInput.addEventListener('input', (e) => {
      state.depth = +e.target.value;
      depthVal.textContent = state.depth + ' cm';
      updatePreview();
      updatePrice();
    });
    colorSwatches.forEach(sw => {
      sw.addEventListener('click', () => {
        colorSwatches.forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        state.color = sw.dataset.color;
        updatePreview();
      });
    });
    roofType.addEventListener('change', (e) => {
      state.roof = e.target.value;
      updatePreview();
    });
    ledCheck.addEventListener('change', (e) => {
      state.led = e.target.checked;
      updatePreview();
      updatePrice();
    });

    // Inizializza
    updatePreview();
    updatePrice();

    // CTA: puoi modificare l'URL con il tuo numero o pagina contatti
    ctaBtn.addEventListener('click', (e) => {
      e.preventDefault();
      alert('Configurazione: ' + state.width + 'x' + state.depth + ' cm, colore ' + state.color + ', tetto ' + state.roof + (state.led ? ', LED' : '') + '. Prezzo: ' + totalPriceEl.textContent);
    });
  </script>
</body>
</html>
